name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: "Tests (no Docker: in-process OPC UA server, gateway and broker substitute)"
        run: pytest
      - name: README numbers match the committed results
        run: python scripts/check_readme.py
      - name: In-process experiments reproduce the committed results bit for bit
        run: |
          python scripts/reproduce.py
          git diff --exit-code -- results/inprocess.json results/inprocess_oee.csv results/inprocess_faults.csv
