# Local demonstrator broker: one plain listener, no authentication.
# The compose file only publishes it on 127.0.0.1.
listener 1883
allow_anonymous true

# Keep sessions, subscriptions and queued QoS 1 messages across restarts.
# The collector uses a persistent session, so what is published while it is
# away, or while the broker restarts, is delivered afterwards.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5

max_inflight_messages 200
max_queued_messages 200000

log_dest stdout
log_type error
log_type warning
log_type notice
