[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usine40-cell-pipeline"
version = "0.1.0"
description = "Simulated production cell to OEE dashboard: OPC UA -> MQTT -> PostgreSQL -> Grafana, with measured latency, loss and OEE error."
license = { text = "MIT" }
authors = [{ name = "Guilhem Carmouze" }]
requires-python = ">=3.12"
dependencies = [
    "asyncua>=2.0,<3",
    "paho-mqtt>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.20",
    "pyyaml>=6",
    "numpy>=1.26",
]
capture = [
    "playwright>=1.45",
    "pillow>=10",
]

[project.scripts]
usine40-plc = "usine40.plc:main"
usine40-gateway = "usine40.gateway:main"
usine40-collector = "usine40.collector:main"
usine40-demo = "usine40.demo:main"
usine40-ctl = "usine40.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usine40 = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: in-process OPC UA server, gateway, broker substitute and SQLite (no Docker)",
    "docker: needs the running compose stack (deselected in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["usine40"]
known-local-folder = ["cells"]
